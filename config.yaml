settings:
  # threads: 4   # defaults to availableProcessors - 1

detectors:
  phone:
    type: regex
    label: "[TELEFOONNUMMER]"
    pattern: >
      \+?
      [1-9]{2}
      \s?\d?
      \s?
      [0-9]{7,14}

  email:
    type: regex
    label: "[EMAIL]"
    pattern: >
      [A-Za-z0-9._%+-]+
      \s?@\s?
      [A-Za-z0-9.-]+
      \.
      [A-Za-z]{2,}

  iban:
    type: regex
    label: "[IBAN]"
    pattern: >
      [A-Z]{2}
      \s?\d{2}
      \s?
      (?:\s?[A-Z0-9]{2,4}){3,7}

  url:
    type: regex
    label: "[LINK]"
    pattern: >
      (https?://)?
      (www\.)?
      [-a-zA-Z0-9@:%._+~#=]{1,256}
      \.
      [a-zA-Z0-9()]{1,12}
      \b
      ([-a-zA-Z0-9()@:%_+.~#?&//=]*)
    options:
      ignoreCase: true
      unicodeCharacterClass: true

  trackAndTrace:
    type: regex
    label: "[TRACK&TRACE]"
    pattern: >
      (
        3S[A-Z]{1,4}[0-9]{7,11}
        |
        2S[A-Z]{1,4}[0-9]{2,11}
        |
        [A-Z]{2}[0-9]{7,10}[A-Z]{2}
        |
        KG[0-9]{6,9}
        |
        KB[0-9]{6,9}
      )

  file:
    type: regex
    label: "[BESTAND]"
    pattern: >
      \b
      [\w.-]+
      \.
      (png|jpg|jpeg|gif|pdf|txt|docx?|xlsx?|pptx?)
      \b
    options:
      ignoreCase: true

  greetingNames:
    type: greeting
    labelTo: "[KLANT]"
    labelFrom: "[WERKNEMER]"

  employeeNames:
    type: trie
    label: "[WERKNEMER]"
    file: "data/werknemernamen.txt"
    options:
      ignoreOverlaps: false
      wholeWords: false
      ignoreCase: false
      ignoreFiles: ["data/ignore.txt", "data/brandnames.txt"]

  customerNames:
    type: trie
    label: "[KLANT]"
    file: "data/klantnamen.txt"
    options:
      ignoreOverlaps: true
      wholeWords: true
      ignoreCase: false
      ignoreFiles: ["data/ignore.txt", "data/brandnames.txt"]

  firstNames:
    type: trie
    label: "[KLANT]"
    file: "data/voornamen.txt"
    options:
      ignoreOverlaps: true
      wholeWords: true
      ignoreCase: false
      ignoreFiles: ["data/ignore.txt", "data/brandnames.txt"]

  shopNames:
    type: trie
    label: "[WINKEL]"
    file: "data/shopnames.txt"
    options:
      ignoreOverlaps: true
      wholeWords: true
      ignoreCase: false

  familyNamesNearCustomer:
    type: anchoredTrie
    label: "[KLANT]"
    file: "data/familienamen.txt"
    anchorPattern: "[KLANT]"
    anchorMaxDistance: 5
    anchorSide: BEFORE
    options:
      ignoreOverlaps: true
      wholeWords: true
      ignoreCase: false
      ignoreFiles: ["data/ignore.txt", "data/brandnames.txt"]

  postalCode:
    type: regex
    label: "[POSTCODE]"
    pattern: '\b[1-9][0-9]{3} ?(?!sa|sd|ss)[a-z]{2}\b'
    options:
      ignoreCase: true

  street:
    type: trieTailRegex
    label: "[STRAAT]"
    file: "data/straatnamen.txt"
    tailPattern: '^\s*([,\-–—])?\s*(\d{1,5})(\s*[-/]?\s*[A-Za-z]{1,6})?\b'
    options:
      ignoreOverlaps: true
      wholeWords: true
      ignoreCase: true
      ignoreFiles: ["data/ignore.txt"]

  place:
    type: trie
    label: "[PLAATS]"
    file: "data/plaatsnamen.txt"
    options:
      ignoreOverlaps: true
      wholeWords: true
      ignoreCase: true
      ignoreFiles: ["data/ignore.txt"]

pipeline:
  - type: detect
    detectors: [phone, email, iban, url, trackAndTrace, file]
  - type: replace

  - type: detect
    detectors: [greetingNames, employeeNames, customerNames, firstNames, shopNames]
  - type: replace

  - type: detect
    detectors: [familyNamesNearCustomer]
  - type: replace

  - type: detect
    detectors: [postalCode, street, place]
  - type: consolidate
    label: "[ADRES]"
    maxSpanDistance: 10
  - type: replace

input:
  file: "data/derodewinkel.txt"
  type: WHATSAPP
  groupsFile: "data/groupchats.txt"

output:
  file: "output/anonymized-chatlogs.json"
  requireRoles: [customer]
